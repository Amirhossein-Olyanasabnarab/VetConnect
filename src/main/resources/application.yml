spring:
  application:
    name: VetConnect

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/vetconnect
    username: postgres
    password: 1124
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true